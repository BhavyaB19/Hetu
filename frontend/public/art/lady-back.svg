<!-- PLACEHOLDER FOR MANUAL POLISH: Hetu Lady Justice Reveal Back View -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%" fill="none" stroke="currentColor">
  <defs>
    <linearGradient id="back-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191611" />
      <stop offset="100%" stop-color="#0e0d0a" />
    </linearGradient>
  </defs>

  <!-- Pedestal -->
  <g id="pedestal-back" stroke="#c08a3e" stroke-width="2">
    <rect x="140" y="540" width="120" height="30" rx="4" fill="url(#back-grad)" />
    <path d="M150 540 L165 500 L235 500 L250 540 Z" fill="url(#back-grad)" />
  </g>

  <!-- Robe Back -->
  <g id="body-back" fill="url(#back-grad)" stroke="#c08a3e" stroke-width="1.5">
    <path d="M165 500 Q150 350 158 270 Q145 250 148 220 L252 220 Q255 250 242 270 Q250 350 235 500 Z" />
    <!-- Cloak folds -->
    <path d="M180 230 Q170 380 185 495" stroke="#c08a3e" stroke-width="1" opacity="0.5" />
    <path d="M200 230 Q205 380 200 495" stroke="#c08a3e" stroke-width="1" opacity="0.5" />
    <path d="M220 230 Q230 380 215 495" stroke="#c08a3e" stroke-width="1" opacity="0.5" />
  </g>

  <!-- Arms Back View -->
  <g id="arms-back" stroke="#c08a3e" stroke-width="2" stroke-linecap="round">
    <path d="M150 230 L115 295 L110 385" />
    <path d="M250 230 L285 175 L325 165" />
  </g>

  <!-- Head & Hair Knot (Back) -->
  <g id="head-back" stroke="#c08a3e" stroke-width="1.5">
    <path d="M185 220 L185 195 L215 195 L215 220 Z" fill="url(#back-grad)" />
    <!-- Back of head with coiled bun -->
    <ellipse cx="200" cy="160" rx="18" ry="24" fill="#13110d" />
    <circle cx="200" cy="150" r="12" fill="#c08a3e" opacity="0.8" />
    <path d="M195 142 Q200 135 205 142" stroke="#e8dcc8" stroke-width="1.5" />
    <!-- Knot of blindfold tied behind the head -->
    <path d="M185 155 L215 155" stroke="#c08a3e" stroke-width="3" />
    <path d="M200 155 Q205 170 215 185 M200 155 Q195 170 185 185" stroke="#c08a3e" stroke-width="2" />
  </g>
</svg>
